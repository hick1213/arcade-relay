  - id: S-13
    title: "Menu 场景（必需要素齐全）"
    pillar: P-04
    assignee: ui-engineer
    phase: prototype
    status: review
    acceptance: "MenuScene 实际存在 4 要素并可用点击操作: (1)开始游戏=「新周目」按钮跳转 GameScene 志向选择、有 run 快照时另显示「继续周目」; (2)游戏外显示=可展开的面板显示最高分/统计（周目数等）; (3)设置=BGM/SFX 音量滑块（0–1、实时作用于 sound.volume）、操作说明面板; (4)退出入口=「返回标题」按钮回 TitleScene"
  - id: S-14
    title: "元进度持久化（最高分/统计 + 损坏协议）"
    pillar: P-03
    assignee: gameplay-engineer
    phase: prototype
    status: review
    acceptance: "systems/meta/（metaTypes/metaSchema/metaProgression 纯 reducer）+ persistence/SaveAdapter: 周目终结时 applyRunResult→立即 persist 1 次（连续重开不重复保存）; 测试 A=保存→新实例从 localStorage 重新加载→最高分/统计/endings_seen 一致恢复; 测试 B=注入损坏存档（含 1 件 valid JSON 但 schema 不正的用例）→原始数据备份到 .bak.<epoch> 键、console.error 前缀 [SaveCorruption] 恰好 1 次、以默认值重建且 recovered 传播到 Title/Menu; 测试用内存 Storage mock，不触碰真实存档"
  - id: S-15
    title: "ResultScene 与场景循环闭合"
    pillar: P-03
    assignee: ui-engineer
    phase: prototype
    status: review
    acceptance: "ResultScene 显示败局或周目结果与总评分（score=floor(silver×0.5+rep×10+power×20+endingBonus)）; 「再来一周目」→GameScene 志向选择且重开时计时器/客人/岗位表/弃牌堆全部重置（状态泄漏检查）; 「回到菜单」→MenuScene; 以实际操作走完 Title→Menu→Game→Result→Menu 一轮无报错"
