# stories.yaml — 江湖客满（Phase 2 分解。schema: contract.md §7）
# 支柱: P-01 一日节奏的经营呼吸 / P-02 活宝伙计的成长可视化 / P-03 志向贯穿的后果兑现 / P-04 单手纯点击的顺手
# 排列 = 实现顺序。prototype = 核心循环垂直切片（开始→挑战→奖励→再挑战）+ Title→Menu→Game→Result→Menu 所需最小集合。
stories:
  - id: S-01
    title: "点击输入抽象化模块"
    pillar: P-04
    assignee: gameplay-engineer
    phase: prototype
    status: review
    acceptance: "systems/input/ 单模块处理 pointerdown: 在测试场景中放置 2 个 ≥BUTTON_MIN_SIZE_PX 的判定区并同时重叠时，按优先级仲裁只触发高优先级一方的语义化事件（如 onTableTap）；全部交互为单次点击即触发，无 pointerup/双击/长按/拖拽依赖；systems/input/ 不 import Phaser"
  - id: S-02
    title: "客栈环境最低视觉表现与画面布局"
    pillar: P-01
    assignee: gameplay-engineer
    phase: prototype
    status: review
    acceptance: "GameScene 中背景可视化（IMG-01~03 就绪前允许纯色/渐变占位）且画面布局确定: 6 张桌位、出餐口、柜台在 1280x720 构图中位置固定并可点击；晨/日/夜三相各自有明显可辨的色调差异（程序化 tint 或背景切换）；Scale.FIT 下任意窗口尺寸均不裁切主要交互区"
  - id: S-03
    title: "一日相位控制器（晨/日/夜状态机）"
    pillar: P-01
    assignee: gameplay-engineer
    phase: prototype
    status: review
    acceptance: "dayCycle 纯状态机: 晨间点击「开门营业」→日间；夜间点击「天明」→次日晨间且日数+1；日间以 DAY_SERVICE_DURATION_S=180s 为唯一硬计时（用 delta 累计，快进测试中 180 等效秒后自动进入夜间）；第 20 日夜触发终战事件；晨间/夜间无强制时限、超过 MORNING_GUIDE_TARGET_S 仅按钮脉冲"
  - id: S-04
    title: "志向系统与新周目开局"
    pillar: P-03
    assignee: gameplay-engineer
    phase: prototype
    status: review
    acceptance: "新周目进入志向选择（财/侠/名 3 个 ≥48px 图标按钮）; 选定后银子/声望为 GDD 初始值（150/15、60/30、90/40）; 志向确认时 run 快照写入 SaveData; ambition 模块不依赖 Phaser"
  - id: S-05
    title: "晨间岗位分配与修练成长"
    pillar: P-01
    assignee: gameplay-engineer
    phase: prototype
    status: review
    acceptance: "两次点击指派（先点岗位图标→再点伙计头像，再次点击已指派伙计=取消）; 容量约束生效: 掌柜 ≤1、采购 0–2、修练 ≤TRAINING_SLOTS=2、跑堂 0–5，超容量的指派被拒绝且有提示; 修练指派使指定属性 +TRAINING_GAIN=1（上限 STAFF_STAT_MAX=10）且成长阶段按 0–6/7–13/14+ 刷新; 排班未完成也可点「开门营业」（未指派=待命）"
  - id: S-06
    title: "日间接客核心循环（客人流/订单/后厨/上菜收钱）"
    pillar: P-01
    assignee: gameplay-engineer
    phase: prototype
    status: review
    acceptance: "散客按 CUSTOMER_INTERVAL_D1_3_S=12s 到达→入座亮起点单气泡→点击空桌派空闲跑堂点单（ORDER_TAKE_S）→后厨按 DISH_PREP(n) 制菜→出餐口亮起→点击派跑堂上菜（SERVE_S）→吃完亮起银两气泡→点击收钱; 收入=round(菜价×(1+剩余耐心比例×TIP_FACTOR)); 耐心归零则客人离店、声望 −2; 伙计移动用 delta 驱动且同一伙计同时只做 1 单; 立绘可用占位色块"
